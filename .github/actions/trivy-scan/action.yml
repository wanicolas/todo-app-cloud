name: "Trivy Security Scan"
description: "Scans a Docker image for CRITICAL and HIGH vulnerabilities using Trivy"
inputs:
  image-ref:
    description: "The reference of the image to scan (e.g. repo/image:tag)"
    required: true

runs:
  using: "composite"
  steps:
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        format: table
        severity: CRITICAL,HIGH
        exit-code: 1
        ignore-unfixed: true
