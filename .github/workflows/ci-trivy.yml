name: CI Trivy Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t todo-backend:scan ./backend

      - name: Build client image
        run: docker build -t todo-client:scan ./client

      - name: Build auth image
        run: docker build -t todo-auth:scan ./auth

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: todo-backend:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Scan client image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: todo-client:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true

      - name: Scan auth image
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: todo-auth:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
