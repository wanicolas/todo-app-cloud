name: CI E2E

on:
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: docker compose up -d --build

      - name: Wait for app to be ready
        run: |
          echo "Waiting for backend API..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3080/api/greeting > /dev/null 2>&1; then
              echo "Backend API is ready!"
              break
            fi
            echo "Waiting for backend... ($i/60)"
            sleep 5
          done

          echo "Waiting for auth service..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3080/api/auth/health > /dev/null 2>&1; then
              echo "Auth service is ready!"
              break
            fi
            echo "Waiting for auth... ($i/30)"
            sleep 5
          done

          echo "Waiting for client..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3080 2>&1 | grep -q 'root'; then
              echo "Client is ready!"
              exit 0
            fi
            echo "Waiting for client... ($i/30)"
            sleep 5
          done

          echo "App failed to start. Docker logs:"
          docker compose logs
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Debug - check services
        run: |
          echo "=== Docker containers ==="
          docker compose ps
          echo ""
          echo "=== Client page content ==="
          curl -s http://localhost:3080 | head -30
          echo ""
          echo "=== API greeting ==="
          curl -s http://localhost:3080/api/greeting
          echo ""
          echo "=== Client logs ==="
          docker compose logs client 2>&1 | tail -30
          echo ""
          echo "=== Backend logs ==="
          docker compose logs backend 2>&1 | tail -15

      - run: npm ci

      - name: Cache Playwright browsers
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Run E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      - name: Stop services
        if: always()
        run: docker compose down
