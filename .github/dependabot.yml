version: 2
updates:
  # 1. Mise à jour des actions GitHub dans .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # 2. Mise à jour des dépendances npm (racine)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"

  # 3. Mise à jour des dépendances npm (backend)
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # 4. Mise à jour des dépendances npm (auth)
  - package-ecosystem: "npm"
    directory: "/auth"
    schedule:
      interval: "weekly"

  # 5. Mise à jour des dépendances npm (client)
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"

  # 6. Mise à jour des images de base Docker (backend Dockerfile)
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "weekly"

  # 7. Mise à jour des images de base Docker (auth Dockerfile)
  - package-ecosystem: "docker"
    directory: "/auth"
    schedule:
      interval: "weekly"

  # 8. Mise à jour des images de base Docker (client Dockerfile)
  - package-ecosystem: "docker"
    directory: "/client"
    schedule:
      interval: "weekly"
