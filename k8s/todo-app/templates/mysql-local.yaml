{{- if .Values.mysql.local.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-local
  labels:
    app: mysql-local
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-local
  template:
    metadata:
      labels:
        app: mysql-local
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.21
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.keyvault.secrets.mysqlPassword | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.db | quote }}
          ports:
            - containerPort: 3306
              name: mysql
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-local
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql-local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-auth-local
  labels:
    app: mysql-auth-local
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-auth-local
  template:
    metadata:
      labels:
        app: mysql-auth-local
    spec:
      containers:
        - name: mysql
          image: mysql:8.0.21
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: {{ .Values.keyvault.secrets.mysqlPassword | quote }}
            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.authDb | quote }}
          ports:
            - containerPort: 3306
              name: mysql
          livenessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3306
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-auth-local
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql-auth-local
{{- end }}
