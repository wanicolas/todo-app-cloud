apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
data:
  MYSQL_HOST: {{ .Values.mysql.host | quote }}
  MYSQL_USER: {{ .Values.mysql.user | quote }}
  MYSQL_DB: {{ .Values.mysql.db | quote }}
  MYSQL_SSL: {{ .Values.mysql.ssl | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
data:
  MYSQL_HOST: {{ default .Values.mysql.host .Values.mysql.authHost | quote }}
  MYSQL_USER: {{ .Values.mysql.user | quote }}
  MYSQL_DB: {{ .Values.mysql.authDb | quote }}
  MYSQL_SSL: {{ .Values.mysql.ssl | quote }}
  JWT_EXPIRES_IN: {{ .Values.auth.env.jwtExpiresIn | quote }}
---
{{- if not .Values.keyvault.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: todo-secret
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_PASSWORD: {{ .Values.keyvault.secrets.mysqlPassword | quote }}
  JWT_SECRET: {{ .Values.keyvault.secrets.jwtSecret | quote }}
{{- end }}
