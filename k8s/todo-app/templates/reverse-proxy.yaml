apiVersion: v1
kind: ConfigMap
metadata:
  name: reverse-proxy-config
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        sendfile on;
        keepalive_timeout 65;

        {{- if .Values.reverseProxy.tls.enabled }}
        # HTTP Server - redirect to HTTPS
        server {
            listen 80;
            server_name _;
            return 301 https://$host$request_uri;
        }

        # HTTPS Server
        server {
            listen 443 ssl;
            server_name _;

            ssl_certificate /etc/nginx/ssl/tls.crt;
            ssl_certificate_key /etc/nginx/ssl/tls.key;
            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_ciphers HIGH:!aNULL:!MD5;

            # Route requests starting with /api/auth to the auth microservice
            location /api/auth {
                proxy_pass http://auth:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Route requests starting with /api to the backend microservice
            location /api {
                proxy_pass http://backend:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            # Route everything else to the client microservice
            location / {
                proxy_pass http://client:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        {{- else }}
        # HTTP Only Server
        server {
            listen 80;
            server_name _;

            location /api/auth {
                proxy_pass http://auth:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api {
                proxy_pass http://backend:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location / {
                proxy_pass http://client:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
        {{- end }}
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reverse-proxy
  labels:
    app: reverse-proxy
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.reverseProxy.replicaCount }}
  selector:
    matchLabels:
      app: reverse-proxy
  template:
    metadata:
      labels:
        app: reverse-proxy
    spec:
      containers:
        - name: reverse-proxy
          image: "{{ .Values.reverseProxy.image.repository }}:{{ .Values.reverseProxy.image.tag }}"
          imagePullPolicy: {{ .Values.reverseProxy.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
            {{- if .Values.reverseProxy.tls.enabled }}
            - containerPort: 443
              name: https
            {{- end }}
          volumeMounts:
            - name: config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            {{- if .Values.reverseProxy.tls.enabled }}
            - name: ssl-certs
              mountPath: /etc/nginx/ssl
              readOnly: true
            {{- end }}
      volumes:
        - name: config-volume
          configMap:
            name: reverse-proxy-config
        {{- if .Values.reverseProxy.tls.enabled }}
        - name: ssl-certs
          secret:
            secretName: {{ .Values.reverseProxy.tls.secretName | quote }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: reverse-proxy
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.reverseProxy.service.type }}
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
    {{- if .Values.reverseProxy.tls.enabled }}
    - port: 443
      targetPort: 443
      protocol: TCP
      name: https
    {{- end }}
  selector:
    app: reverse-proxy
