apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  labels:
    app: auth
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.auth.replicaCount }}
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: "{{ .Values.auth.image.repository }}:{{ .Values.auth.image.tag }}"
          imagePullPolicy: {{ .Values.auth.image.pullPolicy }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 3001
              name: http
          resources:
            {{- toYaml .Values.auth.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/auth/health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/auth/health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          env:
            - name: MYSQL_HOST
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: MYSQL_HOST
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: MYSQL_USER
            - name: MYSQL_DB
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: MYSQL_DB
            - name: MYSQL_SSL
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: MYSQL_SSL
            - name: JWT_EXPIRES_IN
              valueFrom:
                configMapKeyRef:
                  name: auth-config
                  key: JWT_EXPIRES_IN
            {{- if .Values.keyvault.enabled }}
            - name: MYSQL_PASSWORD_FILE
              value: "/mnt/secrets/mysql-admin-password"
            - name: JWT_SECRET_FILE
              value: "/mnt/secrets/jwt-secret"
            {{- else }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: MYSQL_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-secret
                  key: JWT_SECRET
            {{- end }}
          {{- if .Values.keyvault.enabled }}
          volumeMounts:
            - name: secrets-store-inline
              mountPath: "/mnt/secrets"
              readOnly: true
          {{- end }}
      {{- if .Values.keyvault.enabled }}
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "todo-keyvault-secrets"
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
spec:
  type: {{ .Values.auth.service.type }}
  ports:
    - port: 80
      targetPort: 3001
      protocol: TCP
      name: http
  selector:
    app: auth
